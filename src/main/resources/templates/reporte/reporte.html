<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      lang="es">
<head th:replace="~{plantillas/plantilla :: head}"></head>
<body class="bg-light">
<header th:replace="~{plantillas/plantilla :: header}"></header>

<main class="container my-4">
    <div class="card shadow-sm border-0">
        <div class="card-header bg-white py-3 d-flex justify-content-between align-items-center flex-wrap gap-2">
            <h4 class="m-0 fw-bold text-primary">Reporte Diario de Ventas</h4>
            <!-- Filtro de fecha (default: hoy) + descarga del PDF -->
            <form th:action="@{/reporte/diario}" method="get" class="d-flex gap-2 align-items-center">
                <input type="date" class="form-control" name="fecha" th:value="${fecha}">
                <button type="submit" class="btn btn-primary">Ver reporte</button>
            </form>
        </div>
        <div class="card-body p-0">
            <div class="p-3 bg-white border-bottom">
                <span class="fw-semibold">Fecha del reporte:</span>
                <span th:text="${fechaFormateada}">10/11/2026</span>
                <a class="btn btn-danger btn-sm float-end"
                   th:href="@{/reporte/diario/pdf(fecha=${fecha})}">
                    Descargar PDF
                </a>
            </div>
            <div class="table-responsive">
                <table class="table table-hover table-striped align-middle mb-0">
                    <thead class="table-light">
                        <tr>
                            <th scope="col" style="width: 60px;">ID</th>
                            <th scope="col" style="width: 160px;">Hora</th>
                            <th scope="col">Vendedor</th>
                            <th scope="col">Bloque</th>
                            <th scope="col">Producto</th>
                            <th scope="col" style="width: 110px;" class="text-center">Cantidad</th>
                            <th scope="col" style="width: 120px;" class="text-end">Total</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:if="${#lists.isEmpty(ventas)}">
                            <td colspan="7" class="text-center py-4 text-muted">
                                No hay ventas registradas para el día seleccionado.
                            </td>
                        </tr>
                        <tr th:each="v : ${ventas}">
                            <td class="fw-semibold" th:text="${v.id}">1</td>
                            <td th:text="${v.fecha != null ? #temporals.format(v.fecha, 'HH:mm') : '—'}">12:00</td>
                            <!-- Snapshot del vendedor: se muestra aunque ya esté borrado -->
                            <td th:text="${v.vendedorNombre != null ? v.vendedorNombre : '—'}">Carlos Hernández López</td>
                            <td th:text="${v.bloqueNombre != null ? v.bloqueNombre : '—'}">Zona Centro</td>
                            <td th:text="${v.productoNombre != null ? v.productoNombre : '—'}">Manzana Royale</td>
                            <td class="text-center" th:text="${v.cantidad}">2</td>
                            <td class="text-end" th:text="${'$' + #numbers.formatDecimal(v.total, 1, 2)}">$900.00</td>
                        </tr>
                    </tbody>
                    <tfoot class="table-light">
                        <tr>
                            <td colspan="6" class="fw-bold text-end">TOTAL DEL DÍA</td>
                            <td class="fw-bold text-end" th:text="${'$' + #numbers.formatDecimal(totalDia, 1, 2)}">$1,575.00</td>
                        </tr>
                    </tfoot>
                </table>
            </div>
        </div>
    </div>
</main>

<footer th:replace="~{plantillas/plantilla :: footer}"></footer>
</body>
</html>

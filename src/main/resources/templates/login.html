<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      lang="es">
<head th:replace="~{plantillas/plantilla :: head}"></head>
<body class="bg-light">
<header th:replace="~{plantillas/plantilla :: header}"></header>

<main class="container my-5">
    <div class="row justify-content-center">
        <div class="col-md-5 col-lg-4">
            <div class="card shadow-sm border-0">
                <div class="card-body p-4">
                    <h3 class="card-title text-center mb-4 fw-bold">Iniciar Sesión</h3>

                    <!-- Mensajes de error -->
                    <div th:if="${param.error}" class="alert alert-danger" role="alert">
                        <span th:if="${session != null and session['SPRING_SECURITY_LAST_EXCEPTION'] != null}"
                              th:text="${session['SPRING_SECURITY_LAST_EXCEPTION'].message == 'User is disabled' ? 'Cuenta deshabilitada. No tiene acceso al sistema.' : 'Usuario o contraseña incorrectos.'}">
                            Usuario o contraseña incorrectos.
                        </span>
                        <span th:unless="${session != null and session['SPRING_SECURITY_LAST_EXCEPTION'] != null}">
                            Usuario o contraseña incorrectos, o cuenta deshabilitada.
                        </span>
                    </div>

                    <!-- Mensaje de logout exitoso -->
                    <div th:if="${param.logout}" class="alert alert-success" role="alert">
                        Ha cerrado sesión exitosamente.
                    </div>

                    <form th:action="@{/login}" method="post">
                        <div class="mb-3">
                            <label for="username" class="form-label">Usuario</label>
                            <input type="text" id="username" name="username" class="form-control" placeholder="Ingrese su usuario" required autofocus>
                        </div>
                        <div class="mb-3">
                            <label for="password" class="form-label">Contraseña</label>
                            <input type="password" id="password" name="password" class="form-control" placeholder="Ingrese su contraseña" required>
                        </div>
                        <div class="d-grid mt-4">
                            <button type="submit" class="btn btn-primary">Entrar</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</main>

<footer th:replace="~{plantillas/plantilla :: footer}"></footer>
</body>
</html>
